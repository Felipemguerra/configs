name: Secret scan

on:
  workflow_call:
    inputs:
      configs-ref:
        description: Ref of Felipemguerra/configs containing the Gitleaks rules.
        required: false
        type: string
        default: master
    secrets:
      GITLEAKS_LICENSE:
        description: Optional Gitleaks license for organization accounts.
        required: false

jobs:
  scan:
    name: Gitleaks and TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out central Gitleaks configuration
        uses: actions/checkout@v7
        with:
          repository: Felipemguerra/configs
          ref: ${{ inputs.configs-ref }}
          path: .central-config
          sparse-checkout: gitleaks/config.toml
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .central-config/gitleaks/config.toml
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.90.11
