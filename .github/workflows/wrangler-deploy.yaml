name: Deploy and scan production

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment used for deployment secrets and approvals.
        required: false
        type: string
        default: production
      node-version:
        description: Node.js version used to build the site.
        required: false
        type: string
        default: '22'
      check-command:
        description: Command used to validate the production build.
        required: false
        type: string
        default: npm run check
      deploy-command:
        description: Command used to deploy the production application.
        required: false
        type: string
        default: npm run deploy
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: production-deployment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production application
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: ${{ inputs.check-command }}

      - name: Deploy production application
        run: ${{ inputs.deploy-command }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
